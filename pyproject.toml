[project]
name = "durable-agents-chat"
version = "0.1.0"
description = "FastAPI + OpenAI Agents SDK + durable-actors WebSocket chat demo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "durable-actors==0.8.0",
  "openai-agents==0.23.1",
  "fastapi>=0.135,<1",
  "uvicorn>=0.35,<1",
  "python-dotenv>=1,<2",
]

[project.urls]
Repository = "https://github.com/TerseAI/durable-actors-openai-agents-sdk-python-example"
Issues = "https://github.com/TerseAI/durable-actors-openai-agents-sdk-python-example/issues"

[dependency-groups]
dev = ["durable-actors[cli]==0.8.0", "ruff>=0.12,<1"]

[tool.uv.sources]
# Reproducible async SDK snapshot from merged durable-actors PR #189.
durable-actors = { git = "https://github.com/TerseAI/durable-actors.git", rev = "68ecb7ee59a7fb74929039113444dd479a2a4f2c", subdirectory = "sdk-python" }

[tool.uv]
# Override the SDK checkout's local Rust source with the published runtime wheel.
override-dependencies = ["durable-actors-runtime==0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
